<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Portfólio UGC de Thamyres Harmatiuk para marcas de beleza, haircare, skincare, bodycare e lifestyle."
    />
    <meta property="og:title" content="Thamyres Harmatiuk | UGC Creator" />
    <meta
      property="og:description"
      content="Beleza que prende o olhar. Conteúdo que move a escolha."
    />
    <title>Thamyres Harmatiuk | UGC Creator</title>
    <style>
      :root {
        --micro-type: clamp(0.63rem, 0.76vw, 0.74rem) !important;
      }

      #root .section-kicker {
        font-size: 0.68rem !important;
      }

      #root .category-header h3,
      #root .photo-item h3 {
        font-size: 0.76rem !important;
      }

      #root .metric-document h3,
      #root .metrics-handle {
        font-size: 0.72rem !important;
      }

      #root .price-row strong,
      #root .price-row small {
        font-size: 0.69rem !important;
      }

      #root .contact-links span,
      #root .contact-links strong,
      #root .social-row a,
      #root .social-row .social-item {
        font-size: 0.71rem !important;
      }

      #root .profile-facts dt,
      #root .profile-facts dd {
        font-size: 0.62rem !important;
      }

      /* Sobre mim: mesma distribuição visual da referência */
      #root .profile-panel {
        padding-top: clamp(3.5rem, 5vw, 5rem) !important;
        grid-template-rows: auto auto 1fr !important;
      }

      #root .about-title {
        margin: 0 !important;
      }

      #root .profile-panel .about-bio {
        align-self: start !important;
        margin: 0 !important;
        padding: clamp(2.5rem, 4vw, 4rem) 0 0 !important;
      }

      #root .profile-panel .profile-facts {
        margin-top: auto !important;
      }

      /* Serviços e investimento */
      #root .services .process-flow {
        width: 100%;
        margin-bottom: 1.6rem;
        font-size: 0.78rem !important;
        letter-spacing: 0.06em;
      }

      #root .services .price-row {
        min-height: 0 !important;
        padding: 0.75rem 0 !important;
      }

      #root .services .price-table .bases-block {
        width: 100%;
        margin-top: 0 !important;
        padding: 1rem 0 0 !important;
        border-top: 1px solid rgba(0, 0, 0, 0.22);
        border-bottom: 0 !important;
      }

      #root .services .service-list > div:last-child,
      #root .services .price-row.extras-row {
        border-bottom: 0 !important;
      }

      @media (max-width: 720px) {
        #root .profile-panel {
          padding-top: 1.8rem !important;
          grid-template-rows: auto auto auto !important;
        }

        #root .profile-panel .about-bio {
          padding-top: 1.8rem !important;
        }

        #root .services .process-flow {
          font-size: 0.76rem !important;
          gap: 0.45rem;
        }

        #root .services .price-row {
          min-height: 0 !important;
          padding: 0.75rem 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
