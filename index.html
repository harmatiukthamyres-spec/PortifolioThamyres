<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Portfólio UGC de Thamyres Harmatiuk para marcas de beleza, haircare, skincare, bodycare e lifestyle."
    />
    <meta property="og:title" content="Thamyres Harmatiuk | UGC Creator" />
    <meta
      property="og:description"
      content="Beleza que prende o olhar. Conteúdo que move a escolha."
    />
    <title>Thamyres Harmatiuk | UGC Creator</title>
    <style>
      /* Ajustes finais da seção de serviços */
      #root .services {
        display: flex;
        flex-direction: column;
      }

      #root .about-title {
        margin-top: 1.1rem;
      }

      #root .services > .services-heading {
        order: 1;
      }

      #root .services > .services-intro {
        order: 2;
      }

      #root .services > .process-block {
        display: contents;
      }

      #root .services .process-block > .section-kicker {
        order: 3;
      }

      #root .services .process-flow {
        order: 4;
        width: 100%;
        margin-bottom: 1.6rem;
        font-size: 0.75rem !important;
        letter-spacing: 0.06em;
      }

      #root .services > .services-grid {
        order: 5;
        width: 100%;
      }

      #root .services .bases-block {
        order: 6;
        width: calc(64% - 3.84vw);
        align-self: flex-end;
        margin-top: 1.25rem;
        padding-top: 1rem;
      }

      #root .services .price-row {
        min-height: 0 !important;
        padding: 0.75rem 0 !important;
      }

      @media (max-width: 1100px) {
        #root .services .bases-block {
          width: 100%;
          align-self: stretch;
        }
      }

      @media (max-width: 720px) {
        #root .about-title {
          margin-top: 0.55rem;
        }

        #root .services .process-flow {
          font-size: 0.75rem !important;
          gap: 0.45rem;
        }

        #root .services .price-row {
          min-height: 0 !important;
          padding: 0.75rem 0 !important;
        }

        #root .services .bases-block {
          margin-top: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
